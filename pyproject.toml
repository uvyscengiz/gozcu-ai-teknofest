[project]
name = "gozcu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.121",
    "pydantic>=2.13",
    "openai>=1.0",
    "gradio>=5.0",
    "pillow",
    "lap",
    "opencv-python",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "litellm[proxy]>=1.50"]
mac = ["mlx-vlm>=0.6.13"]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["gozcu*"]
