[project]
name = "gozcu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.121",
    "numpy>=1.26",
    "pydantic>=2.13",
    "openai>=1.0",
    # 6.x zorunlu: 5.x'te `Chatbot(type=...)` var ama 6'da yok ve `theme`
    # `launch()`'a taşındı — konsol 5.x'te `TypeError` ile hiç açılmıyor.
    "gradio>=6.0",
    "pillow",
    "lap",
    "opencv-python",
    "matplotlib>=3.8",
    "qdrant-client>=1.12",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "litellm[proxy]>=1.50"]
mac = ["mlx-vlm>=0.6.13"]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["gozcu*"]
