[project]
name = "gozcu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.121",
    "numpy>=1.26",
    "pydantic>=2.13",
    "openai>=1.0",
    # Web konsolu (Görev 21). Dördü de `gradio` emekliye ayrılmadan ÖNCE
    # transitif olarak geliyordu (`sse-starlette` ise yalnız `dev`
    # ekstrasının `litellm[proxy] → mcp` zinciriyle); `gradio` düşünce
    # temiz bir kurulumda hiçbiri kalmıyordu. `python-multipart` ŞART:
    # `POST /api/run` videoyu `multipart/form-data` ile alıyor ve o paket
    # olmadan FastAPI import anında hata veriyor.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # `server.py:80` doğrudan import ediyor (`anyio.to_thread.run_sync` —
    # `_snapshot` ve STT olay döngüsünü bloklamasın diye). `starlette`
    # üzerinden transitif geliyordu; kodun import ettiği paket beyan edilir.
    "anyio>=4.4",
    "pillow",
    "lap",
    "opencv-python",
    "matplotlib>=3.8",
    "qdrant-client>=1.12",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "litellm[proxy]>=1.50"]
mac = ["mlx-vlm>=0.6.13"]
stt = ["faster-whisper"]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["gozcu*"]
